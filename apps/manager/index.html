<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luminose Business Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      /* Les jetons de la charte : la barre suit le thème choisi, pas seulement le système. */
      ::-webkit-scrollbar-thumb {
        background: var(--bord);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--champ);
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <!-- Point d'entrée pour Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
