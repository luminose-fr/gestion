# Worker MCP — Claude interroge Google Ads, en lecture seule.
#
# UN WORKER À PART, et pas une route de workers/api : l'authentification n'est
# pas celle de la console (OAuth pour Claude, là où la console signe ses propres
# jetons), et une erreur de configuration ici ne doit pas pouvoir exposer l'API
# de l'application. Les deux Workers ne partagent ni secret ni binding.
#
# Mise en place : workers/mcp/README.md.

name = "luminose-mcp"
main = "src/index.ts"
compatibility_date = "2026-01-31"

# Exigé par @cloudflare/workers-oauth-provider pour les Client ID Metadata
# Documents : les documents des clients sont lus par `fetch`, et ce drapeau
# interdit que ces lectures atteignent une adresse interne (SSRF). Sans lui,
# la bibliothèque n'annonce pas CIMD, et Claude ne trouve aucun moyen d'entrer.
compatibility_flags = ["global_fetch_strictly_public"]

# Une seule adresse. Garder workers.dev ouvert donnerait une seconde origine,
# dont l'URL de retour Google n'est pas déclarée : la connexion y échouerait,
# et les métadonnées OAuth y décriraient un serveur que personne n'utilise.
workers_dev = false
preview_urls = false

# `custom_domain` crée l'enregistrement DNS au premier déploiement : pas de
# manipulation à faire dans le tableau de bord. La zone luminose.fr est déjà
# chez Cloudflare (voir workers/api/wrangler.toml).
#
# ATTENTION TOML : cette clé doit rester AVANT tout en-tête de table — placée
# après [vars] ou [[kv_namespaces]], elle serait lue comme un champ de cette
# table et ignorée, et le déploiement réussirait sans domaine.
routes = [
  { pattern = "mcp.luminose.fr", custom_domain = true }
]

[vars]
# Couche A : la seule adresse admise à se connecter (cadrage du 30/09/2026).
# Pas un secret — la voir ici, c'est pouvoir la relire en revue.
ALLOWED_EMAIL = "florent@luminose.fr"

# V9 — exécutions d'écriture permises sur 24 heures glissantes (cadrage écriture
# du 01/10/2026, valeur proposée). Une variable, pas une constante : la changer
# ne touche pas au code. Absente ou illisible, l'écriture est fermée.
ADS_ECRITURES_MAX_JOUR = "30"

# Créer des campagnes — décisions du 02/10/2026
# (workers/mcp/decisions/2026-10-02-creer-des-campagnes.md). En euros. Absentes ou
# illisibles, la création est fermée ; la lecture et le lot 1 continuent.
# Relevés le 07/10/2026 (DG1 du cadrage Demand Gen) : 10 → 15 et 25 → 45.
ADS_BUDGET_MAX_JOUR = "15"    # R3 — budget quotidien d'une campagne créée ; équivalent quotidien d'un budget total
ADS_BUDGET_MAX_TOTAL = "45"   # R3 — actives + « [Claude] » en pause, nouvelle comprise
ADS_CPC_MAX = "2"             # R3 — CPC max en « Maximiser les clics » (Search) ; CPC cible (Demand Gen, DG2)
# R4 — la campagne dont le ciblage est recopié (« Psychopraticien - Prospects - Troubles anxieux »).
ADS_CAMPAGNE_MODELE = "24187680610"

# Demand Gen — décisions du 07/10/2026 (workers/mcp/decisions/2026-10-07-demand-gen.md).
# DG1 — budget total maximal d'une campagne, en euros. Absent ou illisible, Demand Gen est fermé.
ADS_BUDGET_MAX_CAMPAGNE = "700"
# DG3 — « clé:id,clé:id » : les objectifs personnalisés (custom_conversion_goal.id) créés par
# Florent dans Google Ads → Objectifs. Le serveur n'en crée aucun. Vide, la création de
# campagne Demand Gen est fermée.
ADS_OBJECTIFS_CONVERSION = "achat:6459365992,rdv:6459373814"
# DG4 — les lieux du préréglage « locale » (geoTargetConstants, séparés par des virgules ;
# ads_requete sur geo_target_constant les retrouve). Vide, ce préréglage est fermé ;
# « france_metropolitaine » reste ouvert.
# Fixés le 07/10/2026 : quinze villes par population décroissante, puis trois ajoutées
# par Florent ; l'aperçu d'ads_dg_groupe_creer les nomme.
ADS_ZONE_LOCALE = "1006219,1006203,1006205,9050259,1006201,9049929,9050003,9049513,9049315,9049977,9049422,1006214,9050156,9049624,9049582,9050316,9049424,1006154"

# Le corpus — décision du 03/10/2026 (workers/mcp/decisions/2026-10-03-corpus.md).
# Commits et déploiements permis sur 24 heures glissantes, à part du plafond
# Google Ads. Absent ou illisible, l'écriture du corpus est fermée ; la lecture
# continue. Le jeton GitHub, lui, est un secret : wrangler secret put GITHUB_TOKEN.
CORPUS_ECRITURES_MAX_JOUR = "20"

# Google Tag Manager — décision du 08/10/2026 (workers/mcp/decisions/2026-10-08-gtm.md).
# Le seul conteneur lu, par son identifiant public (GTM-…, dans le code du site). Vide,
# aucun conteneur ne se lit : gtm_conteneur liste ceux que le jeton voit, pour le choisir.
# Le jeton est un secret à part : GTM_REFRESH_TOKEN (scope tagmanager.readonly seul).
GTM_CONTENEUR = "GTM-KG7VNQL"

# Tag Manager, écrire — décision du 09/10/2026 (workers/mcp/decisions/2026-10-09-gtm-ecriture.md).
# Créations permises sur 24 heures glissantes, à part des plafonds de Google Ads et du corpus.
# Absent ou illisible, l'écriture dans Tag Manager est fermée ; la lecture continue. Le jeton
# est un secret à part : GTM_ECRITURE_REFRESH_TOKEN (scope tagmanager.edit.containers seul —
# ni version ni publication).
GTM_ECRITURES_MAX_JOUR = "20"

[observability]
enabled = true

# État OAuth de la couche A, tenu par @cloudflare/workers-oauth-provider :
# grants, codes et jetons (par empreinte ; les props sont chiffrées), clients
# préenregistrés. Rien n'y entre avant que Google ait certifié l'adresse admise.
#
# Une seule fois, depuis la VM :
#   npx wrangler kv namespace create OAUTH_KV
# puis reporter l'identifiant ci-dessous. Tant qu'il vaut A_REMPLACER,
# `./scripts/deploy.sh mcp` refuse de partir plutôt que d'échouer chez Cloudflare.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "f52db199460f4d1296346f4f7077b3ce"

# Le journal des écritures (V7) — une base À PART de celle de la console, qui
# porte les clés des fournisseurs IA (SPEC §1.1, §5.5).
#
# Une seule fois, depuis la VM :
#   npx wrangler d1 create luminose-mcp --location weur
# puis reporter l'identifiant ci-dessous. Les migrations (migrations/) sont
# appliquées par `./scripts/deploy.sh mcp`, avant le Worker.
[[d1_databases]]
binding = "DB"
database_name = "luminose-mcp"
database_id = "4aa0fa05-1064-42de-845b-3b9f0b4e75ca"
migrations_dir = "migrations"

[dev]
# 8787 est pris par workers/api. En local, le parcours OAuth ne va pas au bout :
# les jetons sont liés à https://mcp.luminose.fr/mcp (voir README).
port = 8788
