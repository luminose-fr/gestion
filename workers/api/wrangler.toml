# Worker API — l'API sur D1, et elle seule.
#
# Les proxys historiques (Notion, 1min.ai) ont été retirés : 1min.ai en phase 6 avec
# l'abstraction fournisseur, Notion le 20/09/2026, un mois après la bascule.
#
# Le nom reste `gestion-luminose-worker` : le front pointe dessus via
# constants.ts jusqu'à la bascule de la phase 5. Le renommer casserait
# l'application en production.

name = "gestion-luminose-worker"
main = "src/index.ts"
compatibility_date = "2026-01-31"
compatibility_flags = ["nodejs_compat"]

# Ajouter `routes` désactive workers.dev par DÉFAUT — et le front l'appelle
# encore en absolu. Le laisser actif garde les deux chemins ouverts pendant la
# bascule vers l'origine unique, et sert de filet ensuite : si la route venait
# à tomber, l'URL workers.dev reste joignable.
workers_dev = true

# ─── Origine unique (SPEC §1.2) ──────────────────────────────────────────
# Le domaine est servi par le projet Pages ; cette route capte /api/* AVANT
# Pages, sur la même origine que le front. C'est ce qui supprime CORS.
#
# Sans elle, /api/* tombe sur le repli SPA de Pages : les appels reçoivent du
# HTML là où ils attendent du JSON, et l'application casse en silence.
#
# ATTENTION TOML : cette clé doit rester AVANT tout en-tête de table
# ([[d1_databases]], [observability]…). Placée après, elle serait lue comme un
# champ de cette table et ignorée — le déploiement réussirait sans la route.
#
# DEUX préfixes, et il faut les deux : la connexion vit sur /auth/login, hors
# de /api. Avec la seule route /api/*, un POST sur /auth/login tombe sur Pages,
# qui répond 405 — et le front affiche « Identifiants incorrects » sans que le
# Worker ait jamais été appelé.
routes = [
  { pattern = "gestion.luminose.fr/api/*", zone_name = "luminose.fr" },
  { pattern = "gestion.luminose.fr/auth/*", zone_name = "luminose.fr" }
]

[observability]
enabled = true

# Où l'on est (SPEC §14.8) : l'origine acceptée pour une écriture n'est que
# celle de cet environnement, et la console n'affiche aucun bandeau.
# La racine EST la production. Elle ne déclare pas la base des clients
# (`CLIENTS`) : la liaison n'y sera posée qu'après la phase S4 (§14.2, règle 2).
[vars]
ENVIRONNEMENT = "production"

# Workers AI — la transcription mot à mot des prises vidéo (SPEC §12.5).
# Une liaison, pas une clé : rien à poser dans Réglages. Facultative : sans
# elle, seule la route /api/transcription se tait, en disant quoi ajouter ici.
[ai]
binding = "AI"

# R2 — les fichiers du montage : prises vidéo et visuels des cartes (SPEC §12.4).
# scripts/deploy.sh crée le bucket s'il n'existe pas, AVANT les migrations : un
# Worker déployé avec une liaison vers un bucket absent échouerait.
[[r2_buckets]]
binding = "MONTAGE"
bucket_name = "luminose-montage"

# Base créée le 19/08/2026 :
#   npx wrangler d1 create luminose-gestion --location weur
[[d1_databases]]
binding = "DB"
database_name = "luminose-gestion"
database_id = "e9327701-3b46-4f85-9e3f-513df1488118"

# La veille des modèles (SPEC §5.7) : une fois par jour, 05:17 UTC — avant la
# journée de travail, et hors de l'heure ronde où les déclencheurs s'empilent.
# Le passage lit OpenRouter, Anthropic et 1min.ai pour les seuls adaptateurs
# qui portent un modèle du catalogue ; ce qu'il trouve s'affiche dans Réglages.
[triggers]
crons = ["17 5 * * *"]

# ═════════════════════════════════════════════════════════════════════════════
# Les environnements (SPEC §14.8). Tout ce qui suit reste APRÈS la racine : en
# TOML, une clé écrite sous un en-tête appartient à cette section.
#
# CE QUI S'HÉRITE, ET CE QUI NE S'HÉRITE PAS — c'est le piège de wrangler :
#   - `vars` et toutes les liaisons (D1, R2, AI) ne s'héritent PAS : chaque
#     environnement redéclare ce qu'il utilise ;
#   - `routes`, `triggers` et `workers_dev` s'héritent : un environnement qui ne
#     les déclare pas viserait les routes et le déclencheur de la PRODUCTION.
#     Ils sont donc écrits, même vides.
# La résolution est vérifiée par la suite de tests (test/configuration.test.ts)
# et, avant tout effet, par scripts/deploy.sh --env recette.
# ═════════════════════════════════════════════════════════════════════════════

# ─── Recette : gestion-recette.luminose.fr ───────────────────────────────────
# Durable, ses propres bases, des données fictives (§14.2, règle 10).
# Ni Workers AI ni R2 : ces liaisons sont facultatives, et la recette s'en passe.
# Ses secrets sont les siens : wrangler secret put … --env recette.
[env.recette]
name = "gestion-luminose-worker-recette"
workers_dev = false
routes = [
  { pattern = "gestion-recette.luminose.fr/api/*", zone_name = "luminose.fr" },
  { pattern = "gestion-recette.luminose.fr/auth/*", zone_name = "luminose.fr" }
]

[env.recette.vars]
ENVIRONNEMENT = "recette"

# Aucun déclencheur : le plan gratuit en donne cinq par compte, recette comprise
# (§14.7), et la veille des modèles n'a rien à faire en recette.
[env.recette.triggers]
crons = []

# npx wrangler d1 create luminose-gestion-recette --location weur
[[env.recette.d1_databases]]
binding = "DB"
database_name = "luminose-gestion-recette"
database_id = "A_REMPLACER"
migrations_dir = "migrations"

# npx wrangler d1 create luminose-clients-recette --jurisdiction=eu
# La juridiction ne se choisit qu'à la création : la vérifier dans le tableau
# de bord avant d'aller plus loin (§14.4).
[[env.recette.d1_databases]]
binding = "CLIENTS"
database_name = "luminose-clients-recette"
database_id = "A_REMPLACER"
migrations_dir = "migrations-clients"

# ─── Local : le poste de développement (npm run dev:api) ─────────────────────
# La racine ne déclare pas `CLIENTS` : le développement passe donc par cet
# environnement, qui la déclare (§14.8). Il ne se déploie jamais — deploy.sh le
# refuse — et n'a ni route, ni workers.dev, ni déclencheur.
#
# Les identifiants sont FICTIFS, et c'est voulu : une commande lancée par erreur
# avec `--env local --remote` ne trouve aucune base, au lieu de trouver celle de
# la production. Ils ne servent qu'à nommer les fichiers de .wrangler/state.
[env.local]
workers_dev = false
routes = []

[env.local.vars]
ENVIRONNEMENT = "local"

[env.local.triggers]
crons = []

[env.local.ai]
binding = "AI"

[[env.local.r2_buckets]]
binding = "MONTAGE"
bucket_name = "luminose-montage"

[[env.local.d1_databases]]
binding = "DB"
database_name = "luminose-gestion-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[[env.local.d1_databases]]
binding = "CLIENTS"
database_name = "luminose-clients-local"
database_id = "00000000-0000-4000-8000-000000000002"
migrations_dir = "migrations-clients"
