# Worker API — l'API sur D1, et elle seule.
#
# Les proxys historiques (Notion, 1min.ai) ont été retirés : 1min.ai en phase 6 avec
# l'abstraction fournisseur, Notion le 20/09/2026, un mois après la bascule.
#
# Le nom reste `gestion-luminose-worker` : le front pointe dessus via
# constants.ts jusqu'à la bascule de la phase 5. Le renommer casserait
# l'application en production.

name = "gestion-luminose-worker"
main = "src/index.ts"
compatibility_date = "2026-01-31"
compatibility_flags = ["nodejs_compat"]

# Ajouter `routes` désactive workers.dev par DÉFAUT — et le front l'appelle
# encore en absolu. Le laisser actif garde les deux chemins ouverts pendant la
# bascule vers l'origine unique, et sert de filet ensuite : si la route venait
# à tomber, l'URL workers.dev reste joignable.
workers_dev = true

# ─── Origine unique (SPEC §1.2) ──────────────────────────────────────────
# Le domaine est servi par le projet Pages ; cette route capte /api/* AVANT
# Pages, sur la même origine que le front. C'est ce qui supprime CORS.
#
# Sans elle, /api/* tombe sur le repli SPA de Pages : les appels reçoivent du
# HTML là où ils attendent du JSON, et l'application casse en silence.
#
# ATTENTION TOML : cette clé doit rester AVANT tout en-tête de table
# ([[d1_databases]], [observability]…). Placée après, elle serait lue comme un
# champ de cette table et ignorée — le déploiement réussirait sans la route.
#
# DEUX préfixes, et il faut les deux : la connexion vit sur /auth/login, hors
# de /api. Avec la seule route /api/*, un POST sur /auth/login tombe sur Pages,
# qui répond 405 — et le front affiche « Identifiants incorrects » sans que le
# Worker ait jamais été appelé.
routes = [
  { pattern = "gestion.luminose.fr/api/*", zone_name = "luminose.fr" },
  { pattern = "gestion.luminose.fr/auth/*", zone_name = "luminose.fr" }
]

[observability]
enabled = true

# Workers AI — la transcription mot à mot des prises vidéo (SPEC §12.5).
# Une liaison, pas une clé : rien à poser dans Réglages. Facultative : sans
# elle, seule la route /api/transcription se tait, en disant quoi ajouter ici.
[ai]
binding = "AI"

# R2 — les fichiers du montage : prises vidéo et visuels des cartes (SPEC §12.4).
# scripts/deploy.sh crée le bucket s'il n'existe pas, AVANT les migrations : un
# Worker déployé avec une liaison vers un bucket absent échouerait.
[[r2_buckets]]
binding = "MONTAGE"
bucket_name = "luminose-montage"

# Base créée le 19/08/2026 :
#   npx wrangler d1 create luminose-gestion --location weur
[[d1_databases]]
binding = "DB"
database_name = "luminose-gestion"
database_id = "e9327701-3b46-4f85-9e3f-513df1488118"
