<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clients, iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>

body{margin:0}
.clair{--fond:#FAF8FC;--surface:#FFFFFF;--bas:#F2EEF6;--actif:#E2D8EF;--bord:#E3DCEB;--champ:#8E84A0;--texte:#231A2E;--second:#5E5470;--marque:#5A3E85;--sur:#FFFFFF;--succes:#0F6B4F;--alerte:#9A4A06;--erreur:#B3261E;--sf:#E3F3EC;--af:#FBEBD6;--ef:#FBE6E3;--voile:rgba(35,26,46,.45);--fil:#F5F1F9;--survol:#F6F2FA;--marqueh:#472E6C;--doux:#EFE9F6;--douxh:#E4DAF0;--champb:#D9D0E4;--champf:#FCFBFD;--ombre:0 1px 2px rgba(35,26,46,.07),0 0 1px rgba(35,26,46,.04)}
.sombre{--fond:#17121D;--surface:#211A2A;--bas:#1C1624;--actif:#32264A;--bord:#3B304A;--champ:#7C7092;--texte:#EDE7F3;--second:#B3A8C2;--marque:#BDA6E8;--sur:#1B1424;--succes:#6FD6AE;--alerte:#F2C063;--erreur:#F4A199;--sf:#14332A;--af:#3A2A12;--ef:#3D1D1A;--voile:rgba(0,0,0,.6);--fil:#1B1523;--survol:#2A2135;--marqueh:#D2C2F2;--doux:#2C2238;--douxh:#362A46;--champb:#4A3E5C;--champf:#1C1624;--ombre:none;color-scheme:dark}
.app *{box-sizing:border-box}
.app{background:var(--fond);color:var(--texte);font:15px/1.4 Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app a{color:inherit;text-decoration:none}
.app button,.app input,.app select,.app textarea{font:inherit;color:inherit}
.app h1{font:500 26px/1.2 Fraunces,Georgia,serif;letter-spacing:-.01em;text-wrap:balance;margin:0}
.tel h1{font-size:23px}
.app h2{font-size:15px;font-weight:600;margin:0}
.app p{margin:0}
.app .e{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--second)}
.app .s{font-size:13px;color:var(--second)}
.app .c{background:var(--surface);border:1px solid var(--bord);border-radius:12px;box-shadow:var(--ombre)}
.app .c>a,.app a.l,.app tr.l{transition:background .14s}
.app .c>a:hover,.app a.l:hover,.app tr.l:hover{background:var(--survol)}
.app .l{border-top:1px solid var(--bord)}
.app .b{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--marque);background:var(--marque);color:var(--sur);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .08s}
.app .b:hover{background:var(--marqueh);border-color:var(--marqueh)}
.app .b:active{transform:translateY(1px)}
.app .b.o{background:var(--doux);border-color:transparent;color:var(--marque)}
.app .b.o:hover{background:var(--douxh);border-color:transparent}
.app .b.o[aria-checked="true"],.app .b.o[aria-pressed="true"]{background:var(--marque)!important;border-color:var(--marque)!important;color:var(--sur)!important;font-weight:600!important}
.app .b.d{border-color:transparent;background:none;padding:0 8px;color:var(--marque);text-decoration:none;font-weight:600}
.app .b.d:hover{background:var(--survol);border-color:transparent;color:var(--marqueh)}
.app a.lien{color:var(--marque);font-weight:600}
.app a.lien:hover,.app a.nom:hover{text-decoration:underline;text-underline-offset:3px}
.app p a{text-decoration:underline;text-underline-offset:3px}
.app .b.p{height:32px;padding:0 12px;font-size:13px}
.app .p:not(.b){display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;border:1px solid var(--bord);color:var(--second);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.app .p.ok{border-color:var(--succes);background:var(--sf);color:var(--succes)}
.app .p.al{border-color:var(--alerte);background:var(--af);color:var(--alerte)}
.app .p.er{border-color:var(--erreur);background:var(--ef);color:var(--erreur)}
.app .f{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--champb);background:var(--champf);box-sizing:border-box;width:100%;transition:border-color .14s,background .14s}
.app .f:hover{border-color:var(--champ)}
.app .f:focus{border-color:var(--marque);background:var(--surface);outline:2px solid var(--marque);outline-offset:-1px}
.app label{font-size:13px;font-weight:500;color:var(--second)}
.app .f::placeholder{color:var(--second)}
.app summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.app summary::-webkit-details-marker{display:none}
.app summary::before{content:"";flex:none;width:7px;height:7px;margin:0 4px 0 2px;border-right:1.6px solid var(--second);border-bottom:1.6px solid var(--second);transform:rotate(-45deg);transition:transform .14s}
.app details[open]>summary::before{transform:rotate(45deg)}
.app .top{margin:-32px -40px 0;padding:0 40px;min-height:68px;display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--bord)}
.app .top h1{font-size:24px;white-space:nowrap}
.app .top .fil{font-size:13px;color:var(--second);font-weight:500;white-space:nowrap}
.app .top .fil:hover{color:var(--texte)}
.app .ong{display:flex;gap:2px;align-self:stretch}
.app .ong a{display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--second);font-weight:500;white-space:nowrap}
.app .ong a:hover{color:var(--texte)}
.app .ong a[aria-selected="true"]{color:var(--texte);border-bottom-color:var(--marque);font-weight:600}
.app .ong .n{font-size:12px;color:var(--second);font-weight:500}
.app .sel{position:relative;display:inline-flex;vertical-align:middle;align-self:flex-start}
.app .sel select.f{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}
.app .sel:has(select[style*="100%"]){display:flex;align-self:stretch}
.app .sel>svg{position:absolute;right:12px;top:50%;margin-top:-6px;pointer-events:none;color:var(--second)}
.app .pas{display:inline-flex;align-items:stretch;height:40px;border:1px solid var(--champb);border-radius:8px;background:var(--champf);overflow:hidden;vertical-align:middle}
.app .pas button{width:36px;border:0;background:none;color:var(--marque);font-size:18px;font-weight:600;cursor:pointer}
.app .pas button:hover{background:var(--doux)}
.app .pas input{width:52px;border:0;text-align:center;font:inherit;font-weight:600;background:none}
.app .suf{display:inline-flex;align-items:center;height:40px;border:1px solid var(--champb);border-radius:8px;background:var(--champf);padding-right:12px;color:var(--second)}
.app .suf input{border:0;background:none;height:38px;width:72px;padding:0 4px 0 12px;font:inherit;text-align:right;color:var(--texte)}
.app .phrase{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:44px}
.app .mod{border-color:var(--marque)!important;box-shadow:0 0 0 1px var(--marque)}
.app .grp{display:flex;padding:3px;gap:2px;border-radius:10px;background:var(--bas)}
.app .grp button{height:34px;padding:0 14px;border:0;border-radius:8px;background:none;color:var(--second);font-weight:500;cursor:pointer;white-space:nowrap}
.app .grp button[aria-checked="true"]{background:var(--surface);color:var(--texte);font-weight:600;box-shadow:var(--ombre),0 0 0 1px var(--bord)}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important}}
.app :focus-visible{outline:2px solid var(--marque);outline-offset:2px}
.tel .f{height:44px;font-size:16px}.tel .b{height:44px}
</style>
</helmet>
<div class="{{theme}} app tel" style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><h1 style="flex: 1; padding-left: 4px">Clients</h1><a href="TelNouvelleFiche.dc.html" class="b">Nouvelle fiche</a></div>
<label for="rech" style="position: absolute; left: -9999px">Nom, e-mail ou téléphone</label>
<input id="rech" class="f" type="search" placeholder="Nom, e-mail ou téléphone">
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px">
<div class="c">
<sc-for list="{{clients}}" as="c" hint-placeholder-count="8">
<a href="TelFiche.dc.html" class="{{c.cls}}" style="min-height: 60px; box-sizing: border-box; padding: 8px 14px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">{{c.nom}}</span><span class="s">{{c.ville}} · {{c.n}}</span><span class="s">{{c.quand}}</span></span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
</a>
</sc-for>
</div>
</div>
<dc-import name="TabBar" actif="clients" sombre="{{sombre}}" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const sombre = !!this.props.sombre;
return Object.assign({ theme: sombre ? 'sombre' : 'clair', sombre: sombre, replie: !!this.props.replie, noop: function () {} }, this.vals());
}
vals() {
const c = (nom, ville, n, quand, i) => ({ nom: nom, ville: ville, n: n, quand: quand });
return { clients: [
c('Nadia Benali', 'Castelnaudary', '12 séances', 'Prochaine : aujourd’hui, 14 h 00'),
c('Marc Fabre', 'Toulouse', '7 séances', 'Dernière : mardi 24 novembre'),
c('Élodie Garcia', 'Villefranche-de-Lauragais', '4 séances', 'Dernière : hier, 15 h 30'),
c('Sophie Lacombe', 'Castelnaudary', 'aucune séance', 'Dernière : mardi 24 novembre (absente)'),
c('Camille Martin', 'Villefranche-de-Lauragais', '9 séances', 'Prochaine : lundi 30 novembre, 9 h 00'),
c('Thomas Petit', 'Toulouse', 'aucune séance', 'Prochaine : aujourd’hui, 16 h 30'),
c('Camille Roux', 'Toulouse', '2 séances', 'Dernière : jeudi 5 novembre')
].map((x, i) => ({ ...x, cls: i ? 'l' : '' })) };
}
}
</script>
</body>
</html>
