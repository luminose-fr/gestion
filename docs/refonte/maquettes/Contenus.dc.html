<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Contenus, conversations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>

body{margin:0}
.clair{--fond:#FAF8FC;--surface:#FFFFFF;--bas:#F2EEF6;--actif:#E2D8EF;--bord:#E3DCEB;--champ:#8E84A0;--texte:#231A2E;--second:#5E5470;--marque:#5A3E85;--sur:#FFFFFF;--succes:#0F6B4F;--alerte:#9A4A06;--erreur:#B3261E;--sf:#E3F3EC;--af:#FBEBD6;--ef:#FBE6E3;--voile:rgba(35,26,46,.45);--fil:#F5F1F9;--survol:#F6F2FA;--marqueh:#472E6C;--ombre:0 1px 2px rgba(35,26,46,.07),0 0 1px rgba(35,26,46,.04)}
.sombre{--fond:#17121D;--surface:#211A2A;--bas:#1C1624;--actif:#32264A;--bord:#3B304A;--champ:#7C7092;--texte:#EDE7F3;--second:#B3A8C2;--marque:#BDA6E8;--sur:#1B1424;--succes:#6FD6AE;--alerte:#F2C063;--erreur:#F4A199;--sf:#14332A;--af:#3A2A12;--ef:#3D1D1A;--voile:rgba(0,0,0,.6);--fil:#1B1523;--survol:#2A2135;--marqueh:#D2C2F2;--ombre:none;color-scheme:dark}
.app *{box-sizing:border-box}
.app{background:var(--fond);color:var(--texte);font:15px/1.4 Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app a{color:inherit;text-decoration:none}
.app button,.app input,.app select,.app textarea{font:inherit;color:inherit}
.app h1{font:500 26px/1.2 Fraunces,Georgia,serif;letter-spacing:-.01em;text-wrap:balance;margin:0}
.tel h1{font-size:23px}
.app h2{font-size:15px;font-weight:600;margin:0}
.app p{margin:0}
.app .e{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--second)}
.app .s{font-size:13px;color:var(--second)}
.app .c{background:var(--surface);border:1px solid var(--bord);border-radius:12px;box-shadow:var(--ombre)}
.app .c>a,.app a.l,.app tr.l{transition:background .14s}
.app .c>a:hover,.app a.l:hover,.app tr.l:hover{background:var(--survol)}
.app .l{border-top:1px solid var(--bord)}
.app .b{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--marque);background:var(--marque);color:var(--sur);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .08s}
.app .b:hover{background:var(--marqueh);border-color:var(--marqueh)}
.app .b:active{transform:translateY(1px)}
.app .b.o{background:transparent;color:var(--marque)}
.app .b.o:hover{background:var(--actif);border-color:var(--marque)}
.app .b.d{border-color:transparent;background:none;padding:0 4px;color:var(--marque);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.app .b.d:hover{background:none;border-color:transparent;color:var(--marqueh)}
.app .b.p{height:32px;padding:0 12px;font-size:13px}
.app .p:not(.b){display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;border:1px solid var(--bord);color:var(--second);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.app .p.ok{border-color:var(--succes);background:var(--sf);color:var(--succes)}
.app .p.al{border-color:var(--alerte);background:var(--af);color:var(--alerte)}
.app .p.er{border-color:var(--erreur);background:var(--ef);color:var(--erreur)}
.app .f{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--champ);background:var(--surface);box-sizing:border-box;width:100%;transition:border-color .14s}
.app .f:hover{border-color:var(--marque)}
.app .f::placeholder{color:var(--second)}
.app summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.app summary::-webkit-details-marker{display:none}
.app summary::before{content:"";flex:none;width:7px;height:7px;margin:0 4px 0 2px;border-right:1.6px solid var(--second);border-bottom:1.6px solid var(--second);transform:rotate(-45deg);transition:transform .14s}
.app details[open]>summary::before{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important}}
.app :focus-visible{outline:2px solid var(--marque);outline-offset:2px}
.tel .f{height:44px;font-size:16px}.tel .b{height:44px}
</style>
</helmet>
<div class="{{theme}} app" style="display: flex; flex-wrap: wrap; min-height: 1000px">
<div style="flex: none; display: flex; background: var(--bas); border-right: 1px solid var(--bord)"><dc-import name="Nav" actif="contenus" sombre="{{sombre}}" replie="{{replie}}" hint-size="232px,900px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="max-width: 1150px; width: 100%; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"><h1 style="flex: 1">Contenus</h1>
<label for="modele" style="position: absolute; left: -9999px">Modèle de rédaction</label><select id="modele" class="f" style="width: 180px"><option>Claude Opus 5.5</option></select>
<button type="button" class="b">Nouveau</button></header>
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--bord)">
<div role="tablist" style="display: flex; gap: 4px">
<a role="tab" aria-selected="true" href="Contenus.dc.html" style="padding: 10px 12px; font-weight: 600; color: var(--marque); border-bottom: 2px solid var(--marque)">Conversations <span class="s">70</span></a>
<a role="tab" aria-selected="false" href="Idees.dc.html" style="padding: 10px 12px; font-weight: 500; color: var(--second)">Idées <span class="s">24</span></a>
<a role="tab" aria-selected="false" href="Publies.dc.html" style="padding: 10px 12px; font-weight: 500; color: var(--second)">Publiés <span class="s">19</span></a>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<label for="rc" style="position: absolute; left: -9999px">Rechercher dans les conversations</label><input id="rc" class="f" type="search" placeholder="Rechercher" style="width: 260px">
<div role="radiogroup" aria-label="Étape" style="display: flex; gap: 4px; flex-wrap: wrap">
<button type="button" role="radio" aria-checked="true" class="b o p" style="background: var(--actif)">Tout 70</button><button type="button" role="radio" aria-checked="false" class="b o p" style="font-weight: 500">Écrire 67</button><button type="button" role="radio" aria-checked="false" class="b o p" style="font-weight: 500">Tourner 0</button><button type="button" role="radio" aria-checked="false" class="b o p" style="font-weight: 500">Monter 0</button><button type="button" role="radio" aria-checked="false" class="b o p" style="font-weight: 500">Publier 3</button>
</div>
</div>
<sc-for list="{{series}}" as="s" hint-placeholder-count="2">
<section class="c">
<div style="padding: 12px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap"><h2 style="flex: 1">Série · {{s.nom}}</h2><span class="s">{{s.compte}}</span><a href="#plan" class="s" style="text-decoration: underline">Ouvrir le plan</a></div>
<sc-for list="{{s.items}}" as="i" hint-placeholder-count="4">
<a href="Contenu.dc.html" class="l" style="padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<span class="p" style="flex: none">{{i.rang}}</span>
<span style="flex: 1; min-width: 260px; display: flex; flex-direction: column"><span><span style="font-weight: 600">{{i.titre}}</span> <span class="p">{{i.format}}</span></span><span class="s" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.dernier}}</span></span>
<span style="width: 200px; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; gap: 3px"><sc-for list="{{i.barres}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 4px; border-radius: 999px; background: {{b}}"></span></sc-for></span><span class="s" style="color: {{i.etatCoul}}">{{i.etat}}</span></span>
<span class="s" style="width: 56px; text-align: right">{{i.date}}</span>
</a>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre": {"editor": "boolean", "default": false}, "replie": {"editor": "boolean", "default": false}, "$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
renderVals() {
const sombre = !!this.props.sombre;
return Object.assign({ theme: sombre ? 'sombre' : 'clair', sombre: sombre, replie: !!this.props.replie }, this.vals());
}
vals() {
const I = (rang, titre, format, dernier, fait, total, etat, date, fini) => ({ rang: rang, titre: titre, format: format, dernier: dernier, etat: etat, date: date, etatCoul: fini ? 'var(--succes)' : 'var(--second)',
barres: Array.from({ length: total }, (_, k) => (k < fait ? (fini ? 'var(--succes)' : 'var(--marque)') : 'var(--bord)')) });
return { series: [
{ nom: 'Ce qu’on refuse de sentir', compte: '7 publications · 0 publiée', items: [
I('1/7', 'Débrancher les émotions', 'Reel expliqué', 'Rédacteur · Ajusté : 8 séquences, ≈ 66 s.', 2, 5, 'Script écrit', '12 nov.'),
I('2/7', 'Tout ce qui ne s’exprime pas s’imprime', 'Carrousel', 'Coach · Carrousel, 7 slides : le carnet et la page d’en dessous', 1, 6, 'Atelier · 1 tour', '9 nov.'),
I('5/7', 'Une armure plus solide', 'Reel expliqué', 'Rédacteur · Script rédigé.', 5, 5, '✓ Exportée le 30 oct. · 9:16', '7 nov.', true),
I('6/7', '« Gestion du stress » ?', 'Article', 'Vous · Rangé dans « Ce qu’on refuse de sentir » n° 6.', 3, 4, 'Brouillon écrit', '7 nov.')
] },
{ nom: 'Ce qu’on attend de la thérapie', compte: '4 publications · 0 publiée', items: [
I('1/4', 'Pourquoi cherche-t-on un truc magique ?', 'Article', 'Coach · Promesse : comprendre pourquoi on cherche le déclic', 1, 4, 'Atelier · 1 tour', '7 nov.'),
I('3/4', 'Une séance, c’est un plâtre. Un suivi, c’est la rééducation', 'Reel expliqué', 'Vous · Repassé en écriture.', 2, 5, '! Script · 1 point à corriger', '9 nov.')
] }
] };
}
}
</script>
</body>
</html>
