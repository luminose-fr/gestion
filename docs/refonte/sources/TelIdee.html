@title Noter une idée, iPhone
@size 390 844
@props {"notee":{"editor":"boolean","default":false}}
@body
<div class="{{theme}} app tel" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; background: var(--voile)">
<sc-if value="{{notee}}" hint-placeholder-val="{{ false }}">
<div role="status" class="c" style="margin: 0 16px 110px; padding: 12px 16px; border-color: var(--succes); color: var(--succes); font-weight: 600">✓ Idée notée</div>
</sc-if>
<sc-if value="{{saisie}}" hint-placeholder-val="{{ true }}">
<div class="c" role="dialog" aria-modal="true" aria-label="Noter une idée" style="border-radius: 12px 12px 0 0; border-bottom: 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; min-height: 44px"><h1 style="flex: 1; padding-left: 4px">Noter une idée</h1><a href="TelAujourdhui.dc.html" class="b d">Fermer</a></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="idee" style="font-weight: 500">L’idée, en une ligne ou plus</label><textarea id="idee" class="f" rows="4" style="height: 112px; padding: 10px 12px; resize: none">Le corps garde la trace de ce qu’on n’a pas dit : partir du carnet et de la page d’en dessous.</textarea></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="format" style="font-weight: 500">Format</label><select id="format" class="f"><option>Carrousel</option><option>Reel expliqué</option><option>Article</option><option>Script Youtube</option></select><span class="s">Pré-choisi d’après votre dernier contenu. Modifiable.</span></div>
<button type="button" class="b">Ajouter</button>
</div>
</sc-if>
</div>
@logic
vals() {
return { notee: !!this.props.notee, saisie: !this.props.notee };
}
